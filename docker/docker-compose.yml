name: mmhdmap

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      network: host  # Use host network during build to inherit proxy settings

    image: mmhdmap-dev:latest

    container_name: mmhdmap-dev

    # Use host network to inherit host's network configuration
    network_mode: "host"

    stdin_open: true
    tty: true

    user: "root"

    environment:
      TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"

    volumes:
      - ..:/workspace/mmhdmap  # Mount project root to /workspace
      # - /team/shared:/team/shared
      - /home/guyu/data:/data

    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use all available GPUs
              capabilities: [gpu]